    <form action="#" method="post">

            <Label For="Nama_Pelanggan">Nama Pelanggan:</Label>&nbsp;&nbsp;&nbsp;
            <input type="text" name="Nama_Pelanggan" id="Nama_Pelanggan" placeholder="Masukkan Nama">

           <select name="Kategori_Layanan" id="Kategori_Layanan" required>

           <br><br>
           <label for="Metode_Pembayaran">Metode Pembayaran:</label>
           <input type="radio" name="Tranfer_Bank" value="Bank" id="kategori_bank" checked>
           <label for="kategori_Bank">Transfer Bank</label>
           <input type="radio" name="E_Wallet" value="Digital" id="kategori_digital">
           <label for="kategori_digital">E-Walltet</label>
           <br><br>
           <button type="submit">Kirim Form</button>
        </Fieldset>
    </form>
